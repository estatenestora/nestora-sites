<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Nestora — AI Service Onboarding</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root {
  --bg: #0d1117;
  --surface: #161b22;
  --s2: #1c2330;
  --border: #30363d;
  --text: #e6edf3;
  --muted: #8b949e;
  --accent: #58a6ff;
  --green: #10b981;
  --purple: #a78bfa;
  --red: #f87171;
  --r: 12px;
}
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}
.app {
  flex: 1;
  max-width: 480px;
  margin: 0 auto;
  width: 100%;
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}
.header {
  display: flex;
  align-items: center;
  gap: 12px;
  padding-bottom: 12px;
  border-bottom: 1px solid var(--border);
}
.logo { font-size: 28px; }
.title { font-size: 18px; font-weight: 700; }
.sub { font-size: 12px; color: var(--muted); }

.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r);
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.card-title { font-size: 14px; font-weight: 600; color: var(--accent); }

textarea, input, select {
  width: 100%;
  background: var(--s2);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 10px 12px;
  color: var(--text);
  font-size: 14px;
  outline: none;
}
textarea { resize: vertical; min-height: 100px; }
input:focus, textarea:focus, select:focus { border-color: var(--accent); }

.btn {
  background: linear-gradient(135deg, #1d4ed8, #7c3aed);
  color: #fff;
  border: none;
  border-radius: var(--r);
  padding: 12px;
  font-weight: 600;
  font-size: 15px;
  cursor: pointer;
  width: 100%;
  text-align: center;
}
.btn:disabled { opacity: 0.5; cursor: not-allowed; }

.chip-grid { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  background: var(--s2);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 6px 14px;
  font-size: 13px;
  cursor: pointer;
}
.chip.active {
  background: var(--accent);
  color: #fff;
  border-color: var(--accent);
}

.loader {
  display: none;
  text-align: center;
  padding: 20px;
  font-size: 14px;
  color: var(--muted);
}
.hidden { display: none !important; }
</style>
</head>
<body>

<div class="app">
  <div class="header">
    <span class="logo">🤖</span>
    <div>
      <div class="title">AI Service Onboarding</div>
      <div class="sub">Register your service in seconds</div>
    </div>
  </div>

  <!-- STEP 1: PROMPT INPUT -->
  <div id="step-prompt" class="card">
    <div class="card-title">Describe Your Service</div>
    <p style="font-size:13px; color:var(--muted)">Tell Nestora AI about your business (services offered, location, rates, experience, etc.):</p>
    <textarea id="prompt-input" placeholder="e.g. I offer professional home cleaning and deep kitchen wash in Salt Lake Kolkata for ₹800/visit..."></textarea>
    <button id="analyze-btn" class="btn">✨ Analyze with AI</button>
  </div>

  <div id="loader" class="loader">
    <span>⏳ Nestora AI is understanding your service...</span>
  </div>

  <!-- STEP 2: DYNAMIC GAP FORM -->
  <div id="step-form" class="card hidden">
    <div class="card-title">Complete Missing Details</div>
    <div id="gap-container" style="display:flex; flex-direction:column; gap:12px;"></div>
    <button id="submit-btn" class="btn">✅ Register Service</button>
  </div>

  <!-- STEP 3: SUCCESS -->
  <div id="step-success" class="card hidden" style="text-align:center;">
    <span style="font-size:48px">🎉</span>
    <div class="title">Service Live!</div>
    <p id="success-msg" style="font-size:13px; color:var(--muted)"></p>
    <button id="close-btn" class="btn" style="margin-top:12px">Return to Telegram</button>
  </div>
</div>

<script>
const tg = window.Telegram?.WebApp;
if (tg) { tg.expand(); }

const API_BASE = window.location.origin.includes('github') ? 'https://localhost:8080' : '';

let partialData = null;
let collectedData = {};

document.getElementById('analyze-btn').addEventListener('click', async () => {
  const prompt = document.getElementById('prompt-input').value.trim();
  if (!prompt) return alert('Please enter a description');

  document.getElementById('step-prompt').classList.add('hidden');
  document.getElementById('loader').style.display = 'block';

  try {
    const userId = tg?.initDataUnsafe?.user?.id ? String(tg.initDataUnsafe.user.id) : 'dev_user';
    const res = await fetch(`${API_BASE}/api/aiso/parse`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ user_id: userId, prompt })
    });
    const data = await res.json();
    document.getElementById('loader').style.display = 'none';

    if (!data.success) {
      alert(data.error || 'AI parsing failed');
      document.getElementById('step-prompt').classList.remove('hidden');
      return;
    }

    partialData = data.partial_data;
    renderGaps(data.gap_fields, data.catalog_data);
  } catch (err) {
    document.getElementById('loader').style.display = 'none';
    alert('Failed to connect to backend');
    document.getElementById('step-prompt').classList.remove('hidden');
  }
});

function renderGaps(gaps, catalog) {
  const container = document.getElementById('gap-container');
  container.innerHTML = '';

  if (partialData?.services?.length > 0) {
    const s = partialData.services[0];
    collectedData.category_slug = s.category_slug;
    collectedData.service_type_id = s.service_type_id;
    collectedData.service_type_name = s.service_type_name;
  }
  if (partialData?.base_price) collectedData.base_price = partialData.base_price;
  if (partialData?.location_display_name) collectedData.location_display_name = partialData.location_display_name;
  if (partialData?.description) collectedData.description = partialData.description;
  collectedData.collected_attributes = partialData?.attributes || {};

  if (!gaps || gaps.length === 0) {
    submitRegistration();
    return;
  }

  gaps.forEach(gap => {
    const div = document.createElement('div');
    div.style.display = 'flex';
    div.style.flexDirection = 'column';
    div.style.gap = '6px';

    const lbl = document.createElement('label');
    lbl.style.fontSize = '13px';
    lbl.style.fontWeight = '600';
    lbl.innerText = gap.display_label;
    div.appendChild(lbl);

    if (gap.input_type === 'select') {
      const select = document.createElement('select');
      select.innerHTML = '<option value="">Select option...</option>' + 
        (gap.options || []).map(o => `<option value="${o}">${o}</option>`).join('');
      select.onchange = (e) => setGapValue(gap, e.target.value);
      div.appendChild(select);
    } else {
      const inp = document.createElement('input');
      inp.type = gap.input_type === 'number' ? 'number' : 'text';
      inp.placeholder = gap.hint_text || '';
      inp.oninput = (e) => setGapValue(gap, e.target.value);
      div.appendChild(inp);
    }

    container.appendChild(div);
  });

  document.getElementById('step-form').classList.remove('hidden');
}

function setGapValue(gap, val) {
  if (gap.key === '__category__') collectedData.category_slug = val;
  else if (gap.key === '__service_type__') collectedData.service_type_id = val;
  else if (gap.key === '__price__') collectedData.base_price = parseFloat(val) || 0;
  else if (gap.key === '__location__') collectedData.location_display_name = val;
  else if (gap.key === '__description__') collectedData.description = val;
  else {
    collectedData.collected_attributes[gap.key] = val;
  }
}

document.getElementById('submit-btn').addEventListener('click', () => {
  submitRegistration();
});

async function submitRegistration() {
  document.getElementById('step-form').classList.add('hidden');
  document.getElementById('loader').style.display = 'block';

  try {
    const userId = tg?.initDataUnsafe?.user?.id ? String(tg.initDataUnsafe.user.id) : 'dev_user';
    collectedData.user_id = userId;

    const res = await fetch(`${API_BASE}/api/aiso/complete`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(collectedData)
    });
    const data = await res.json();
    document.getElementById('loader').style.display = 'none';

    if (data.success) {
      document.getElementById('success-msg').innerText = `Listing created successfully! ID: ${data.listing_id}`;
      document.getElementById('step-success').classList.remove('hidden');
    } else {
      alert('Registration error: ' + data.error);
      document.getElementById('step-form').classList.remove('hidden');
    }
  } catch (err) {
    document.getElementById('loader').style.display = 'none';
    alert('Failed to complete registration');
    document.getElementById('step-form').classList.remove('hidden');
  }
}

document.getElementById('close-btn').addEventListener('click', () => {
  if (tg) tg.close();
});
</script>
</body>
</html>
